# docs/PIN.toml — the pin as data: PLAN §2 (the original) and §2b (Bend) in a
# form scripts/pin-check.sh can verify at every RESUME and before every gate.
# Phase 0 fills it (RUNBOOK "Minute 14–25: truth pack"), right after PLAN §2.
# PLAN §2 stays the prose copy; when the two disagree, pin-check is RED until
# they agree again. Placeholders are <angle brackets>; one left in place is a
# YELLOW. This is TOML, parsed with Python 3.11+ tomllib: quoted `#` and
# multiline arrays are supported; malformed or empty lane contracts are RED.
schema = "p2b.pin.v1"

[original]
name = "Toon"
path = "legacy/Toon"                  # gitignored; an oracle to run, never a template to read
vcs = "git"
commit = "f955c67015d45330935b3ae4d62178d2bb44a481"
version_cmd = "./oracle/toon --version"
version_expect = "toon 0.2.4"
run_cmd = ["./oracle/toon"]  # exactly MANIFEST.txt original_argv; oracle/toon sha256 980f2b26484f424b74cb0a0b61062183d0038d45101590a38953a82611879a6d
# A shell-quoted string is also accepted, e.g. 'python3 "legacy/tool name.py"'.
# No shell is invoked for run_cmd. The legacy `original:` display is lossy.
build_cmd = "cd legacy/Toon && cargo build --release && cp -p \"$CARGO_TARGET_DIR/release/toon\" ../../oracle/toon"
threads = 1

[bend]
version = "2.0.16"                 # bend --version at capture and proof time (VERSION-DRIFT)
checkout_sha = "15ae0c8"     # when the CLI is a checkout run as bun <dir>/bend2/main.ts (--version is a constant; the sha is the pin)
cli = "bun /tmp/bend/bend2/main.ts"                             # BEND_CLI when bend is not on PATH; the environment's BEND_CLI wins over this line
clang_min = "14"                     # >= 19 for the device toolchain

[lanes]
required = ["interpreter", "c-1t", "c-Nt", "js"]   # add "gpu" only with a bang in the program and a device host below
gpu_host = ""                        # hostname where the gpu lane runs, or "" (the lane is then recorded MISSING with that reason)

[approver]
disc = "the repository owner who commissioned this port"                      # who approves DISC entries; never the agent that implemented the divergence
